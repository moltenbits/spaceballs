name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The xcode-27 image ships Xcode 27 as its only (beta) toolchain; a
      # latest-stable selector finds nothing there. Use the image default
      # and assert its major version.
      - name: Assert Xcode 27 toolchain
        run: xcodebuild -version | tee /dev/stderr | grep -Eq '^Xcode 27'

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Import Developer ID Application certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build, sign, and notarize release
        id: build
        env:
          TEAM_NAME: ${{ secrets.TEAM_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/release.sh ${{ steps.version.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/spaceballs-${{ steps.version.outputs.version }}-macos.tar.gz
          body: |
            **Requires macOS 27 (Golden Gate) or newer.** Spaceballs depends on
            private macOS APIs that can change in any macOS release, so each
            Spaceballs release targets the macOS version it was developed and
            tested on. On an older macOS version, use the last Spaceballs release
            that targeted it.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output SHA256
        run: |
          echo "### Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Archive:** spaceballs-${{ steps.version.outputs.version }}-macos.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          shasum -a 256 dist/spaceballs-${{ steps.version.outputs.version }}-macos.tar.gz >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') }}

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check Homebrew token
        id: homebrew-token
        env:
          HOMEBREW_CASK_TOKEN: ${{ secrets.HOMEBREW_CASK_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_CASK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Homebrew cask update because HOMEBREW_CASK_TOKEN is not configured."
          fi

      - name: Get SHA256 from release
        id: sha256
        if: steps.homebrew-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_NAME="spaceballs-${{ steps.version.outputs.version }}-macos.tar.gz"
          SHA256=$(gh api repos/moltenbits/spaceballs/releases/tags/v${{ steps.version.outputs.version }} \
            --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .digest" \
            | sed 's/sha256://')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        if: steps.homebrew-token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: moltenbits/homebrew-tap
          token: ${{ secrets.HOMEBREW_CASK_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        if: steps.homebrew-token.outputs.available == 'true'
        run: |
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/spaceballs.rb << 'EOF'
          cask "spaceballs" do
            version "${{ steps.version.outputs.version }}"
            sha256 "${{ steps.sha256.outputs.sha256 }}"

            url "https://github.com/moltenbits/spaceballs/releases/download/v#{version}/spaceballs-#{version}-macos.tar.gz"
            name "Spaceballs"
            desc "Keyboard-driven window switcher for Spaces"
            homepage "https://github.com/moltenbits/spaceballs"

            depends_on macos: :golden_gate

            app "Spaceballs.app"
            binary "Spaceballs-CLI.app/Contents/MacOS/spaceballs"

            # Homebrew 7 runs install steps in a sandbox that cannot launch
            # applications (deny lsopen), so the app is NOT relaunched after an
            # upgrade any more; the caveats say so. Local Dev builds have a
            # separate identity and are not stopped by the release app's
            # uninstall hook, so stop one here. No match is normal.
            postflight_steps do
              terminate_process '/Spaceballs Dev\.app/Contents/MacOS/spaceballs([[:space:]]|$)',
                                match: :full
            end

            # Quit the running instance before brew replaces the bundle on
            # upgrade/uninstall — otherwise the old version keeps running from
            # its memory-mapped (deleted) binary until manually restarted.
            uninstall quit: "com.moltenbits.spaceballs"

            caveats <<~EOS
              This release requires macOS 27 (Golden Gate) or newer and was tested
              on macOS 27. Spaceballs relies on private macOS APIs that can change
              in any macOS release — on an older macOS version, install the
              Spaceballs release that targeted it.

              Spaceballs requires Accessibility and Screen Recording permissions.
              Enable them in System Settings > Privacy & Security after installation.

              Upgrades quit the running Spaceballs but cannot relaunch it (Homebrew's
              install sandbox forbids launching apps): open Spaceballs again afterwards.
            EOS
          end
          EOF

          echo "Updated Casks/spaceballs.rb:"
          cat homebrew-tap/Casks/spaceballs.rb

      - name: Commit and push
        if: steps.homebrew-token.outputs.available == 'true'
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/spaceballs.rb
          git commit -m "spaceballs ${{ steps.version.outputs.version }}"
          git push
